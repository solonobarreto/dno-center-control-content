# Substitui o netlify.toml (publish = "." / functions em netlify/functions).
name = "dnorigins-ccc"
main = "cloudflare/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "."                    # publica a raiz do projeto, igual ao publish = "." do Netlify
binding = "ASSETS"
run_worker_first = ["/api/*"]      # só /api/* executa o Worker; o resto é estático

# Substitui o Netlify Blobs (presença e convites). Sem database_id: o `wrangler deploy` cria o
# banco sozinho no primeiro deploy e a tabela é criada no primeiro acesso.
[[d1_databases]]
binding = "DB"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
